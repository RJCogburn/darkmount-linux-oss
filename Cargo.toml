[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/RJCogburn/darkmount-linux-oss"
publish = false

[workspace.dependencies]
darkmount-core = { path = "crates/core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
