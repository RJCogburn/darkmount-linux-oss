[project]
name = "darkmount-linux"
version = "0.1.0"
description = "Offline Linux control for the be quiet! Dark Mount keyboard"
requires-python = ">=3.10"

[project.scripts]
darkmount = "darkmount.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["darkmount"]
