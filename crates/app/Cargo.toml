[package]
name = "darkmount-linux"
description = "Desktop app for the be quiet! Dark Mount keyboard (offline, unofficial)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "darkmount-linux"
path = "src/main.rs"

[dependencies]
darkmount-core.workspace = true
serde_json.workspace = true
# the keyboard pictures are WebP; Slint decodes them through `image`
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
png = "0.18"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
resvg = { version = "0.49", default-features = false }

[build-dependencies]
slint-build = "1.18"
