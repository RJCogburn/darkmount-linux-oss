[package]
name = "darkmount-core"
description = "be quiet! Dark Mount keyboard: QLink protocol, settings, key bindings, firmware updates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "darkmount_core"

[[bin]]
name = "darkmount"
path = "src/bin/darkmount.rs"

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1"
sha2 = "0.11"
base64 = "0.23"
tempfile = "3"
clap = { version = "4.6.7", features = ["derive"] }
